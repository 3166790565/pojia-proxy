services:
  relay:
    # 直接拉取已发布的镜像；本地改动需重新 build 并 push
    image: bxacc123/pojia-router:latest
    container_name: pojia-relay
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8000}:8000"
    environment:
      # 可选：会话签名密钥。留空则首次启动自动生成并持久化到 /data/.secret_key。
      SECRET_KEY: "${SECRET_KEY:-}"
      # 可选：管理员登录密码（明文）。留空则首次启动打印随机密码。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      DB_PATH: /data/relay.db
      PRESET_DIR: /data/presets
      DATA_DIR: /data
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-300}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-4194304}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
    volumes:
      - relay_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  relay_data:
